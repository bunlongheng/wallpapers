name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes to the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions are pinned to a commit, not a moving tag.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # House rule is zero vulnerabilities, so any advisory fails the build.
      - run: npm audit
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:coverage

  e2e:
    name: Build and e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      # The two projects are Desktop Chrome and iPhone 13, and iPhone 13 is WebKit.
      - run: npx playwright install --with-deps chromium webkit
      # CI runs the suite against `next start`, so the production CSP (no
      # 'unsafe-eval') and the prerendered 404 are what actually get tested.
      - run: npm run test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: error
          retention-days: 7
